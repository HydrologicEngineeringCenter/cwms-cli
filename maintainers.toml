[people.charles]
name = "Charles Graham"
email = "charles.r.graham@usace.army.mil"

[people.eric]
name = "Eric Novotny"
email = "eric.v.novotny@usace.army.mil"

[people.mitch]
name = "Mitch Weier"
email = "mitchell.s.weier@usace.army.mil"

[poetry]
authors = ["eric", "charles"]

[cli]
default = ["charles", "eric"]

[cli.commands]
"cwms-cli csv2cwms" = ["charles"]
"cwms-cli blob" = ["charles"]
"cwms-cli update" = ["charles"]
"cwms-cli load" = ["charles", "eric"]
"cwms-cli nws pixml" = ["charles", "eric", "mitch"]
"cwms-cli usgs" = ["eric"]
"cwms-cli shef" = ["eric"]

[docs.pages]
"cli" = "cwms-cli"
"blob" = "cwms-cli blob"
"csv2cwms" = "cwms-cli csv2cwms"
"update" = "cwms-cli update"
"load_location_ids_all" = "cwms-cli load"
"nws_pixml" = "cwms-cli nws pixml"

[[codeowners.rule]]
pattern = "*"
owners = ["charles", "eric"]
comment = "Fallback owners for paths without a later, more specific rule; keep this rule first"

[[codeowners.rule]]
pattern = "/.github/CODEOWNERS"
owners = ["charles", "eric"]
comment = "Protect ownership rules themselves"

[[codeowners.rule]]
pattern = "/maintainers.toml"
owners = ["charles", "eric"]
comment = "Primary configuration file for ownership metadata"

[[codeowners.rule]]
pattern = "/scripts/sync_ownership.py"
owners = ["charles", "eric"]
comment = "Ownership metadata generator"

[[codeowners.rule]]
pattern = "/AGENTS.md"
owners = ["charles", "eric"]
comment = "Repository ownership maintenance guidance"

[[codeowners.rule]]
pattern = "/cwmscli/commands/csv2cwms/"
owners = ["charles"]

[[codeowners.rule]]
pattern = "/docs/cli/csv2cwms*.rst"
owners = ["charles"]

[[codeowners.rule]]
pattern = "/cwmscli/commands/blob.py"
owners = ["charles"]

[[codeowners.rule]]
pattern = "/docs/cli/blob.rst"
owners = ["charles"]

[[codeowners.rule]]
pattern = "/cwmscli/utils/update.py"
owners = ["charles"]

[[codeowners.rule]]
pattern = "/docs/cli/update.rst"
owners = ["charles"]

[[codeowners.rule]]
pattern = "/tests/cli/test_update_command.py"
owners = ["charles"]

[[codeowners.rule]]
pattern = "/cwmscli/load/"
owners = ["charles", "eric"]

[[codeowners.rule]]
pattern = "/docs/cli/load_*.rst"
owners = ["charles", "eric"]

[[codeowners.rule]]
pattern = "/tests/load/"
owners = ["charles", "eric"]

[[codeowners.rule]]
pattern = "/tests/commands/test_load_*.py"
owners = ["charles", "eric"]

[[codeowners.rule]]
pattern = "/cwmscli/usgs/"
owners = ["eric"]

[[codeowners.rule]]
pattern = "/tests/usgs/"
owners = ["eric"]

[[codeowners.rule]]
pattern = "/tests/cli/test_usgs_*.py"
owners = ["eric"]

[[codeowners.rule]]
pattern = "/cwmscli/nws"
owners = ["charles", "eric", "mitch"]

[[codeowners.rule]]
pattern = "/docs/cli/nws_pixml*.rst"
owners = ["charles", "eric", "mitch"]

[[codeowners.rule]]
pattern = "/tests/nws/"
owners = ["charles", "eric", "mitch"]

[[codeowners.rule]]
pattern = "/cwmscli/commands/shef/"
owners = ["eric"]

[[codeowners.rule]]
pattern = "/tests/commands/test_shef_*.py"
owners = ["eric"]

[[codeowners.rule]]
pattern = "/cwmscli/commands/commands_cwms.py"
owners = ["charles", "eric"]
comment = "Shared Click wrappers span commands owned by both maintainers"
