name: CLI Tests

on:
  pull_request:
    branches: [main]

jobs:
  test-python-39:
    name: Test CLI on 3.9
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Configure Poetry to use in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies (including dev/test) and project
        run: poetry install --with dev --no-interaction

      - name: Smoke-test CLI on Python 3.9
        run: poetry run python scripts/smoke_test_cli.py

      - name: Run full test suite
        run: poetry run pytest -q

  test-python-312:
    name: Test CLI on 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build dev container and run tests
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: poetry run pytest -q
