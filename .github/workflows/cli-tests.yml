name: CLI Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test CLI on ${{ matrix.name }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Test the supported Python range on Linux and exercise the primary
          # Python version on each supported desktop operating system.
          - name: Linux
            os: ubuntu-latest
            python-version: "3.9"
          - name: Linux
            os: ubuntu-latest
            python-version: "3.12"
          - name: Windows
            os: windows-latest
            python-version: "3.12"
          - name: macOS
            os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Configure Poetry to use in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies (including dev/test) and project
        run: poetry install --with dev --no-interaction

      - name: Smoke-test CLI on Python 3.9
        if: matrix.python-version == '3.9'
        run: poetry run python scripts/smoke_test_cli.py

      - name: Run full test suite
        run: poetry run pytest -q

  test-devcontainer:
    name: Test dev container on 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build dev container and run tests
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: poetry run pytest -q
