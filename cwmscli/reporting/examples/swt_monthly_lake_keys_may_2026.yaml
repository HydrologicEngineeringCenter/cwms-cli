office: SWT
cda_api_root: https://cwms-data.usace.army.mil/cwms-data
time_zone: America/Chicago
dataset:
  kind: time_series
  project: KEYS
  title: Keystone Lake
  month: "2026-05"
  request_timeout_seconds: 12
  top_conservation_display: 0.00
  top_flood_display: 0.00
  cfs_day_to_acre_feet: 1.9835
  datum_label: FT-NGVD
  month_label_format: abbr
  missing_evaporation: 0
  missing_power_release: 0
  missing_rainfall_dam: 0
  missing_total_release: 0
  normal_rainfall: 4.19
  series:
    elevation:
      tsid: "{project}.Elev.Inst.1Hour.0.Ccp-Rev"
      unit: ft
    storage:
      tsid: "{project}.Stor.Inst.1Hour.0.Ccp-Rev"
      unit: ac-ft
    power_release:
      tsid: "{project}.Flow-Power.Ave.~1Day.1Day.Rev-Regi-Flowgroup"
      unit: cfs
    total_release:
      tsid: "{project}.Flow-Res Out.Ave.~1Day.1Day.Rev-Regi-Flowgroup"
      unit: cfs
    evaporation:
      tsid: "{project}.Evap.Total.~1Day.1Day.Ccp-Rev"
      unit: in
    inflow:
      tsid: "{project}.Flow-Res In.Ave.~1Day.1Day.Regi-Rev-Adjusted"
      unit: cfs
    rainfall_dam:
      tsid: "{project}.Precip-Inc.Total.~1Day.1Day.Ccp-Rev"
      unit: in
    rainfall_basin:
      tsid: "{project}.Precip-Mean Areal.Total.~1Day.1Day.Metvue-Computed"
      unit: in
template:
  source: file
  path: cwmscli/reporting/examples/templates/swt_monthly_lake.txt.j2
report:
  district: "Tulsa District"
  name: "Monthly Lake Report"
